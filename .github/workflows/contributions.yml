name: Update contribution stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution counts (last year)
        id: stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          data=$(gh api graphql -f query='{ user(login: "SouravBiswas238") { contributionsCollection { restrictedContributionsCount contributionCalendar { totalContributions } } } }')
          echo "private=$(echo "$data" | jq '.data.user.contributionsCollection.restrictedContributionsCount')" >> "$GITHUB_OUTPUT"
          echo "total=$(echo "$data" | jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')" >> "$GITHUB_OUTPUT"

      - name: Update README
        run: |
          block='<p align="center">\n  <img src="https://img.shields.io/badge/Contributions%20(last%20year)-${{ steps.stats.outputs.total }}-0e75b6?style=for-the-badge\&logo=github" />\n  <img src="https://img.shields.io/badge/Private%20repo%20contributions-${{ steps.stats.outputs.private }}-7928ca?style=for-the-badge\&logo=github" />\n</p>'
          perl -0pi -e "s#<!-- CONTRIB:START -->.*?<!-- CONTRIB:END -->#<!-- CONTRIB:START -->\n${block}\n<!-- CONTRIB:END -->#s" README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git commit -am "Update contribution stats" && git push)
